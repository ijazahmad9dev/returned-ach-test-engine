[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "returned-ach-test-engine"
version = "0.1.0"
description = "Autonomous Test Engine for Return ACH Automation Backends"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Return ACH QA & Engineering Team" }
]
keywords = ["ach", "testing", "fastapi", "langgraph", "automation", "qa"]

dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.1.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "click>=8.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
ach-test = "test_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["test_engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
