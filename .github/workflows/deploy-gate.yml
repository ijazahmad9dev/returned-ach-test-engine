name: "Post-Deployment Gate & Real-User Evaluation"

on:
  push:
    branches: [ "main", "fix/*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target Runtime API URL"
        required: false
        default: "http://localhost:8000"
      ui_url:
        description: "Control Center UI URL"
        required: false
        default: "http://localhost:3000"

jobs:
  gate:
    name: "Deployment Gate & Client Evidence"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv & Python
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Dependencies
        run: |
          uv sync --all-extras
          uv run playwright install --with-deps chromium

      - name: Run Test Engine Unit & Contract Tests
        run: |
          uv run pytest

      - name: Run Deployment Gate
        env:
          RUNTIME_URL: ${{ github.event.inputs.target_url || 'http://localhost:8000' }}
          UI_URL: ${{ github.event.inputs.ui_url || 'http://localhost:3000' }}
          OUTPUT_DIR: reports/gate
          HEADLESS: "true"
        run: |
          ./scripts/deploy_gate.sh

      - name: Upload Client Evidence Package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-evidence-package
          path: reports/gate/client_package/
          retention-days: 30

      - name: Upload Red Deploy Diagnostics (If Failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: red-deploy-diagnostics
          path: |
            reports/gate/red_deploy_failure.json
            reports/gate/red_deploy_failure.md
            reports/gate/screenshots/
          retention-days: 14
